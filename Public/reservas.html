<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rueda Libre</title>
    <style>
        .reservas-layout {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .reservas-info table {
            width: 100%;
            border-collapse: collapse;
        }

        .reservas-info th,
        .reservas-info td {
            padding: 10px;
            border: 1px solid #888;
            text-align: left;
        }

        .reservas-mapa iframe {
            display: block;
            width: 100%;
            height: 400px;
            border: 0;
        }

        @media (max-width: 700px) {
            .reservas-layout {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 style="left: auto; font-weight:bold;">LA RUEDA LIBRE</h1>
        <nav>
            <ul>
                <li><a href="../index.html">INICIO</a></li>
                <li><a href="mailto:contacto@tudominio.com" target="_blank">contactanos</a></li>
                <li><a href="../Public/terifas.html">TARIFAS</a></li>
                <li><a href="../Public/reservas.html">RESERVAS</a></li>
            </ul>
        </nav>
    </header>
    <br>
    <hr>

    <main>

        <section>

            <h2>Reservas</h2>
            <div class="reservas-layout">
                <div class="reservas-info">
                    <table>
                        <thead>
                            <tr>
                                <th>Lunes</th>
                                <th>8:00 am - 7:00 pm</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Marte</td>
                                <td>8:00 am - 7:00 pm</td>
                            </tr>
                            <tr>
                                <td>Miercoles</td>
                                <td>8:00 am - 7:00 pm</td>
                            </tr>
                            <tr>
                                <td>Jueves</td>
                                <td>8:00 am - 7:00 pm</td>
                            </tr>
                            <tr>
                                <td>Viernes</td>
                                <td>8:00 am - 7:00 pm</td>
                            </tr>
                            <tr>
                                <td>Sabado</td>
                                <td>8:00 am - 12:00 pm</td>
                            </tr>
                        </tbody>
                    </table>

                    <form action="">
                        <label for="">Correo electronico</label>
                        <input type="email">
                        <br>
                        <label for="">Descripcion</label>
                        <textarea name="" id=""></textarea>
                        <button>Enviar</button>
                    </form>
                </div>
                <div class="reservas-mapa">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15865.343423984637!2d-75.58354560000001!3d6.2193664!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e4429ce949305d3%3A0x140f0dcf8574879a!2sBarrio%20Antioquia%20Freestyle%20(La%20Liga%20del%20Barrio)!5e0!3m2!1ses-419!2sco!4v1792516908745!5m2!1ses-419!2sco"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>

        </section>

        <footer>
            <p>&copy; 2026 La Rueda Libre</p>
        </footer>
    </main>

</body>

</html>
